name: NoMount integration
description: Apply NoMount kernel integration.
runs:
  using: composite
  steps:
    - name: 🛡️ Apply NoMount
      shell: bash
      run: |
        set -euo pipefail
        cd "$GITHUB_WORKSPACE"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "🛡️ NoMount integration"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        curl -fsSL --retry 3 \
          https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh \
          | bash -s dev
        echo "✅ NoMount step finished"
